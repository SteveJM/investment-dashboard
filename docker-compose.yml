services:
  database:
    build: ./database
    environment:
      POSTGRES_DB: investment_dashboard
      POSTGRES_USER: investment_dashboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U investment_dashboard -d investment_dashboard']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  service:
    build: ./service
    environment:
      DATABASE_URL: postgres://investment_dashboard:${POSTGRES_PASSWORD:-devpassword}@database:5432/investment_dashboard
      API_PORT: 4000
      MCP_PORT: 4001
      API_KEY: ${API_KEY:-devkey}
      PRICE_PROVIDER: ${PRICE_PROVIDER:-yahoo}
      NEWS_PROVIDER: ${NEWS_PROVIDER:-yahoo}
      SUMMARY_PROVIDER: ${SUMMARY_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      ACCOUNTS: ${ACCOUNTS:-ISA,Taxable,Pension}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
    depends_on:
      database:
        condition: service_healthy
    ports:
      - '4000:4000' # REST API
      - '4001:4001' # MCP server (Streamable HTTP) - point a Claude session/scheduled task at http://localhost:4001/mcp
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      SERVICE_HOST: service
      SERVICE_PORT: 4000
      API_KEY: ${API_KEY:-devkey}
    depends_on:
      - service
    ports:
      - '8080:80'
    restart: unless-stopped

volumes:
  db-data:
